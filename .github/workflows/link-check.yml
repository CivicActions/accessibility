name: Checking links
permissions:
  contents: read
  issues: write

on:
  # Automatic check monthly
  schedule:
    - cron: "0 9 1 * *"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Building site and running HTML proofer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source.
        uses: actions/checkout@v4

      - name: Install jekyll site dependencies.
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: npm run build

      - name: Run HTML proofer
        id: link-checker
        continue-on-error: true
        run: |
          set +e
          output=$(npm run link-checker 2>&1)
          exit_code=$?
          echo "$output"
          delimiter="$(openssl rand -hex 8)"
          {
            echo "output<<${delimiter}"
            echo "$output"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Create GitHub issue on failure
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.link-checker.outcome == 'failure'
        env:
          PROOFER_OUTPUT: ${{ steps.link-checker.outputs.output }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Link check workflow failed';
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const output = process.env.PROOFER_OUTPUT || 'No output captured';
            
            const body = `## Link Checker Failure

            **Workflow run**: [View run](${run_url})

            ### Output
            \`\`\`
            ${output}
            \`\`\``;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['broken-links']
            });

      - name: Check for link checker failures
        if: steps.link-checker.outcome == 'failure'
        run: |
          echo "::error::Link check failed. See the 'Run HTML proofer' step for details."
          exit 1
